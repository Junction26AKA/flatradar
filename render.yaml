# Render Blueprint (free web service). Secrets are entered in the Render dashboard (sync: false).
# Free instances sleep after 15 min without inbound requests: .github/workflows/keepalive.yml hits /api/health
# every 5 min (see docs/development.md → Deploy).
services:
  - type: web
    name: flatradar
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # Also builds the web app into web/dist (served at /, /signin, /app/*). Skipped until web/package.json exists.
    buildCommand: npm ci && if [ -f web/package.json ]; then npm --prefix web ci && npm --prefix web run build; fi
    startCommand: node server.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_DB
        value: flatradar
      - key: CONTEXT_DEV_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM
        sync: false
      - key: SCORER_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DIGITRANSIT_KEY
        sync: false

  # The fair-value model (model/serve.py). Node calls it via SCORER_URL and falls back to its own
  # comparables score if it's slow (>3 s) or down. Kept awake by the Node /api/health route, which pings it.
  - type: web
    name: flatradar-scorer
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r model/requirements.txt
    startCommand: python -m uvicorn serve:app --app-dir model --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths: ["model/**"]
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.16"  # the committed .joblib models were trained and tested on this
      - key: MONGODB_DB
        value: flatradar
      - key: MONGODB_URI
        sync: false
